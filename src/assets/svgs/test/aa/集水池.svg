<svg width="1774" height="960" viewBox="0 0 1774 960" xmlns="http://www.w3.org/2000/svg">
  <!-- 池体主体外框 -->
  <rect x="30" y="70" width="1714" height="720" fill="none" stroke="#000000" stroke-width="3"/>

  <!-- 顶部深色压顶 -->
  <rect x="70" y="70" width="1634" height="130" fill="#282222"/>

  <!-- 左侧灰色挡板 -->
  <rect x="30" y="70" width="40" height="720" fill="#e8e8e8" stroke="#000" stroke-width="2"/>
  <rect x="70" y="70" width="12" height="720" fill="#d0d0d0" stroke="#000" stroke-width="1"/>

  <!-- 右侧灰色挡板 -->
  <rect x="1704" y="70" width="40" height="720" fill="#e8e8e8" stroke="#000" stroke-width="2"/>
  <rect x="1692" y="70" width="12" height="720" fill="#d0d0d0" stroke="#000" stroke-width="1"/>

  <!-- 底部灰色挡板 -->
  <rect x="30" y="750" width="1714" height="40" fill="#e8e8e8" stroke="#000" stroke-width="2"/>
  <rect x="30" y="778" width="1714" height="12" fill="#d0d0d0" stroke="#000" stroke-width="1"/>

  <!-- 水体实心区域 -->
  <rect x="70" y="200" width="1634" height="550" fill="#26c2c2"/>

  <!-- 水面波纹细线 -->
  <g stroke="#86e0e0" stroke-width="2">
    <line x1="90" y1="230" x2="1674" y2="230"/>
    <line x1="120" y1="265" x2="1650" y2="265"/>
    <line x1="80" y1="300" x2="1694" y2="300"/>
    <line x1="140" y1="335" x2="1630" y2="335"/>
    <line x1="100" y1="370" x2="1670" y2="370"/>
    <line x1="160" y1="405" x2="1610" y2="405"/>
    <line x1="110" y1="440" x2="1660" y2="440"/>
    <line x1="130" y1="475" x2="1640" y2="475"/>
    <line x1="95" y1="510" x2="1680" y2="510"/>
    <line x1="150" y1="545" x2="1620" y2="545"/>
    <line x1="105" y1="580" x2="1665" y2="580"/>
    <line x1="170" y1="615" x2="1600" y2="615"/>
    <line x1="125" y1="650" x2="1645" y2="650"/>
    <line x1="145" y1="685" x2="1625" y2="685"/>
    <line x1="85" y1="720" x2="1688" y2="720"/>
    <line x1="135" y1="755" x2="1635" y2="755"/>
  </g>

  <!-- 底部文字 -->
  <text x="887" y="910" font-size="90" font-family="SimHei, sans-serif" fill="#000" text-anchor="middle">集水池</text>
</svg>
