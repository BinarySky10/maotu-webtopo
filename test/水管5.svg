<svg width="2000" height="1000" xmlns="http://www.w3.org/2000/svg">
    <defs>
        <!-- 柔和发光滤镜 -->
        <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
            <feGaussianBlur stdDeviation="3" result="blur" />
            <feComposite in="SourceGraphic" in2="blur" operator="over" />
        </filter>
    </defs>

    <!-- 底层金属管道 路径完全不变 -->
    <path
        d="M510 290 L999 211 L999 332"
        fill="none"
        stroke="#407090"
        stroke-width="16"
        stroke-linecap="round"
        stroke-linejoin="round"
    />

    <!-- 流光基底：连续淡蓝色底色 -->
    <path
        d="M510 290 L999 211 L999 332"
        fill="none"
        stroke="rgba(160,245,255,0.2)"
        stroke-width="6"
        stroke-linecap="round"
        stroke-linejoin="round"
        filter="url(#glow)"
    />

    <!-- 流光层1：主高亮虚线段 -->
    <path
        d="M510 290 L999 211 L999 332"
        fill="none"
        stroke="rgba(160,245,255,0.95)"
        stroke-width="6"
        stroke-linecap="round"
        stroke-linejoin="round"
        stroke-dasharray="18 120"
        filter="url(#glow)"
    >
        <animate
            attributeName="stroke-dashoffset"
            from="600" to="0"
            dur="2.5s"
            repeatCount="indefinite"
        />
    </path>

    <!-- 流光层2：错开相位，增强流动连续感 -->
    <path
        d="M510 290 L999 211 L999 332"
        fill="none"
        stroke="rgba(160,245,255,0.7)"
        stroke-width="5"
        stroke-linecap="round"
        stroke-linejoin="round"
        stroke-dasharray="18 120"
        filter="url(#glow)"
    >
        <animate
            attributeName="stroke-dashoffset"
            from="540" to="-60"
            dur="2.5s"
            repeatCount="indefinite"
        />
    </path>
</svg>