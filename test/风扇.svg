<svg width="200" height="200" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- 外壳金属渐变 -->
    <linearGradient id="shellGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f0f5f9"/>
      <stop offset="100%" stop-color="#7a8fa3"/>
    </linearGradient>
    <!-- 扇叶浅蓝渐变 -->
    <linearGradient id="bladeGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#c6eeff"/>
      <stop offset="100%" stop-color="#3b9ee8"/>
    </linearGradient>
    <!-- 中心轴心径向渐变 -->
    <radialGradient id="centerGrad" cx="0.4" cy="0.4" r="0.8">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#628cb8"/>
    </radialGradient>
  </defs>

  <!-- 外圈防护网框 -->
  <circle cx="100" cy="100" r="92" fill="none" stroke="url(#shellGrad)" stroke-width="5"/>
  <circle cx="100" cy="100" r="82" fill="none" stroke="url(#shellGrad)" stroke-width="2"/>

  <!-- 辐射防护筋条 -->
  <g stroke="#b8c8d8" stroke-width="2">
    <line x1="100" y1="10" x2="100" y2="190"/>
    <line x1="10" y1="100" x2="190" y2="100"/>
    <line x1="36" y1="36" x2="164" y2="164"/>
    <line x1="36" y1="164" x2="164" y2="36"/>
  </g>

  <!-- 四片风扇扇叶（无动画静态） -->
  <g fill="url(#bladeGrad)">
    <path d="M100 100 L145 45 Q155 60 130 100 Z"/>
    <path d="M100 100 L155 145 Q140 155 100 130 Z"/>
    <path d="M100 100 L55 155 Q45 140 70 100 Z"/>
    <path d="M100 100 L45 55 Q60 45 100 70 Z"/>
  </g>

  <!-- 中心轴心圆 -->
  <circle cx="100" cy="100" r="16" fill="url(#centerGrad)"/>
  <circle cx="100" cy="100" r="6" fill="#fff"/>
</svg>