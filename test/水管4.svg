<svg width="400" height="200" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- 流体分段发光渐变 -->
    <linearGradient id="flowLight" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="rgba(140,240,255,0)" />
      <stop offset="35%" stop-color="rgba(160,245,255,0.95)" />
      <stop offset="65%" stop-color="rgba(160,245,255,0.95)" />
      <stop offset="100%" stop-color="rgba(140,240,255,0)" />
    </linearGradient>

    <!-- 柔和发光滤镜 -->
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- 底层金属管道 纯色 #407090 -->
  <path
    d="M30 120 L180 120 L180 40 L360 40"
    fill="none"
    stroke="#407090"
    stroke-width="16"
    stroke-linecap="round"
    stroke-linejoin="round"
  />

  <!-- 多段流光层 1 -->
  <path
    d="M30 120 L180 120 L180 40 L360 40"
    fill="none"
    stroke="url(#flowLight)"
    stroke-width="6"
    stroke-linecap="round"
    stroke-linejoin="round"
    stroke-dasharray="18 22"
    filter="url(#glow)"
  >
    <animate
      attributeName="stroke-dashoffset"
      from="160" to="0"
      dur="2.5s"
      repeatCount="indefinite"
    />
  </path>

  <!-- 多段流光层 2，错开相位 -->
  <path
    d="M30 120 L180 120 L180 40 L360 40"
    fill="none"
    stroke="url(#flowLight)"
    stroke-width="6"
    stroke-linecap="round"
    stroke-linejoin="round"
    stroke-dasharray="18 22"
    filter="url(#glow)"
  >
    <animate
      attributeName="stroke-dashoffset"
      from="80" to="-80"
      dur="2.5s"
      repeatCount="indefinite"
    />
  </path>

  <!-- 多段流光层 3，增强连续流动感 -->
  <path
    d="M30 120 L180 120 L180 40 L360 40"
    fill="none"
    stroke="url(#flowLight)"
    stroke-width="5"
    stroke-linecap="round"
    stroke-linejoin="round"
    stroke-dasharray="18 22"
    filter="url(#glow)"
  >
    <animate
      attributeName="stroke-dashoffset"
      from="40" to="-120"
      dur="2.5s"
      repeatCount="indefinite"
    />
  </path>
</svg>
